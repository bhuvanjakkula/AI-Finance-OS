services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${FINANCE_DB_PASSWORD:?Set FINANCE_DB_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U finance -d finance]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    ports: [127.0.0.1:8000:8000]
    environment:
      DATABASE_URL: postgresql+psycopg://finance:${FINANCE_DB_PASSWORD}@db:5432/finance
      FINANCE_AUTO_CREATE: 'false'
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
    command: [sh, -c, 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://finance:${FINANCE_DB_PASSWORD}@db:5432/finance
      FINANCE_AUTO_CREATE: 'false'
    depends_on:
      api:
        condition: service_healthy
    command: [python, -m, app.worker]
  web:
    build: ./frontend
    ports: [127.0.0.1:5173:5173]
    environment:
      FINANCE_API_INTERNAL_URL: http://api:8000
    depends_on: [api]
volumes:
  postgres-data:
