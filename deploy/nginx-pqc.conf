# Deployment template: requires nginx linked against OpenSSL >=3.5.
# TLS certificate, keys, DNS, private API network and browser support are required.
# Strict hybrid PQ key-exchange groups: incompatible clients fail negotiation.
server {
    listen 443 ssl;
    server_name finance.example.invalid;
    ssl_certificate /run/secrets/tls-fullchain.pem;
    ssl_certificate_key /run/secrets/tls-private-key.pem;
    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519MLKEM768:SecP256r1MLKEM768;
    ssl_session_tickets off;
    client_max_body_size 8m;
    client_body_timeout 15s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; object-src 'none'; frame-ancestors 'none'" always;
    root /srv/finance/dist;
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
    location / { try_files $uri /index.html; }
}
