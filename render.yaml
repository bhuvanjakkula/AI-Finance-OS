services:
  - type: web
    name: ai-finance-os-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FINANCE_ENV
        value: development
      - key: FINANCE_LOCAL_OWNER_ACCESS
        value: "true"
      - key: FINANCE_LOCAL_OWNER_EMAIL
        value: bhuvanjakkula@gmail.com
      - key: FINANCE_LOCAL_OWNER_ORG
        value: finance-qa-20261008
      - key: CORS_ORIGINS
        value: "*"
      - key: FINANCE_ALLOWED_HOSTS
        value: "*"
      - key: FINANCE_AUTO_CREATE
        value: "true"

  - type: worker
    name: ai-finance-os-worker
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.worker
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FINANCE_ENV
        value: development
